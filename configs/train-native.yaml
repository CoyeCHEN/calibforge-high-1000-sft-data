# CalibForge whole-trajectory debug recipe; source snapshot 03074a83743c70394d59b4e17b07a0b122495e54.
# Public train/validation membership and cached tensors are unchanged.
# Five epochs are the requested run budget; this package does not claim a completed GPU run.
# Source CI fixes are included for review, while this corpus uses the thin ShareGPT path.
model_name_or_path: Qwen/Qwen3.5-4B
model_revision: 851bf6e806efd8d0a36b00ddf55e13ccb7b8cd0a
stage: sft
do_train: true
finetuning_type: full
freeze_vision_tower: true
freeze_multi_modal_projector: true
freeze_language_model: false
template: qwen3_5
dataset: calibforge_high_train
eval_dataset: calibforge_high_validation
do_eval: false
dataset_dir: data
tokenized_path: data/lf-cache
output_dir: outputs/calibforge-high-native-e5
cutoff_len: 262144
packing: false
mask_history: false
enable_thinking: true
preserve_thinking: true
bf16: true
optim: adamw_torch
adam_beta1: 0.9
adam_beta2: 0.999
adam_epsilon: 1.0e-8
weight_decay: 0.0
max_grad_norm: 1.0
gradient_checkpointing: true
use_reentrant_gc: false
seed: 42
data_seed: 42
flash_attn: fa2
enable_liger_kernel: true
deepspeed: configs/native-ds.json
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 1.0e-5
num_train_epochs: 5.0
lr_scheduler_type: cosine_with_min_lr
lr_scheduler_kwargs:
  min_lr_rate: 0.1
warmup_ratio: 0.05
logging_steps: 1
save_strategy: epoch
save_only_model: false
load_best_model_at_end: false
dataloader_drop_last: false
report_to: none
